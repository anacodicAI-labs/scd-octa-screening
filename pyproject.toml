[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scd-octa"
version = "0.1.0"
requires-python = ">=3.10"
description = "SCD OCTA screening pipeline (index, biomarkers, baseline, modern model)"
readme = "README.md"
dependencies = [
  "tifffile==2025.5.10",
  "pillow==11.2.1",
  "numpy==2.2.4",
  "pandas==2.2.3",
  "matplotlib==3.10.1",
  "scikit-learn==1.6.1",
  "joblib==1.4.2",
  "jupyterlab==4.3.6",
  "tqdm==4.67.1",
  "pyyaml==6.0.2",
  "torch==2.7.0",
  "torchvision==0.22.0",
  "timm==1.0.15",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
